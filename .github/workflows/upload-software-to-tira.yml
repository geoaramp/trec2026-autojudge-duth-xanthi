name: Upload Software to TIRA

on:
  workflow_dispatch:
    inputs:
      directory:
        description: 'The directory that contains the submission. Can be . for the root of the repository'
        required: true
        default: .

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required python packages
        run: |
          python -m pip install --upgrade pip
          pip3 install tira

      - name: Patch TIRA client compatibility
        run: |
          python -c 'from pathlib import Path; import tira.local_execution_integration as m; p=Path(m.__file__); s=p.read_text(); old="self.tira_client.docker_software(approach=identifier, software_id=software_id)"; new="self.tira_client.docker_software(approach=identifier)"; assert old in s, "compatibility target not found"; p.write_text(s.replace(old,new)); print("Patched", p)'

      - name: Build, test, and upload image
        run: |
          tira-cli login --token ${{ secrets.TIRA_CLIENT_TOKEN }}
          tira-cli verify-installation --task trec-auto-judge --team duth-xanthi
          tira-cli code-submission \
            --path ${{ inputs.directory }} \
            --file Dockerfile \
            --task trec-auto-judge \
            --dataset trec-auto-judge/kiddie-20260605-training \
            --command 'auto-judge run --workflow /auto-judge/judges/duth_quality/workflow.yml --rag-responses $inputDataset/runs/*/ --rag-topics $inputDataset/topics/*.jsonl --out-dir $outputDir'
