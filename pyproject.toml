[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duth-trec-autojudge-2026"
version = "1.0.0"
description = "DUTH XANTHI submission to TREC 2026 AutoJudge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

authors = [
    {name = "DUTH XANTHI"}
]

keywords = ["trec", "autojudge", "rag", "evaluation", "llm"]

dependencies = [
    "autojudge-base>=1.0.0",
    "tira>=0.0.100",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

minima-llm = [
    "minima-llm>=0.2.5",
]

evaluate = [
    "autojudge-evaluate>=1.0.0",
]

all = [
    "duth-trec-autojudge-2026[minima-llm,evaluate,test]",
    "tqdm>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["judges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
